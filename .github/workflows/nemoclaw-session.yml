name: NemoClaw Session (4 Models)

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Session identifier'
        required: false
        default: ''
      chain_count:
        description: 'Chain counter'
        required: false
        default: '0'
      nemoclaw_cache_version:
        description: 'Cache version'
        required: false
        default: 'v1'
      model:
        description: 'Model to use'
        required: true
        default: 'nemotron'
        type: choice
        options:
          - nemotron
          - glm5
          - kimi
          - qwen
  repository_dispatch:
    types: [chain-nemoclaw]

env:
  CHAIN_TRIGGER_MINUTES: 345
  SAVE_INTERVAL_MINUTES: 60
  NEMOCLAW_PORT: 18789

concurrency:
  group: nemoclaw-session-${{ github.event.inputs.model || 'nemotron' }}
  cancel-in-progress: false

jobs:
  nemoclaw-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SELECTED_MODEL: ${{ github.event.inputs.model || 'nemotron' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Map model to config
        id: model
        run: |
          MODEL="${{ env.SELECTED_MODEL }}"
          echo "Selected model: $MODEL"
          
          case "$MODEL" in
            nemotron)
              echo "model_id=nvidia/nemotron-3-super-120b-a12b" >> "$GITHUB_OUTPUT"
              echo "api_key_env=NVIDIA_API_KEY" >> "$GITHUB_OUTPUT"
              echo "sandbox_name=nemotron" >> "$GITHUB_OUTPUT"
              ;;
            glm5)
              echo "model_id=z-ai/glm5" >> "$GITHUB_OUTPUT"
              echo "api_key_env=NVIDIA_API_KEY_2" >> "$GITHUB_OUTPUT"
              echo "sandbox_name=glm5" >> "$GITHUB_OUTPUT"
              ;;
            kimi)
              echo "model_id=moonshotai/kimi-k2.5" >> "$GITHUB_OUTPUT"
              echo "api_key_env=NVIDIA_API_KEY" >> "$GITHUB_OUTPUT"
              echo "sandbox_name=kimi" >> "$GITHUB_OUTPUT"
              ;;
            qwen)
              echo "model_id=qwen/qwen3.5-397b-a17b" >> "$GITHUB_OUTPUT"
              echo "api_key_env=NVIDIA_API_KEY_4" >> "$GITHUB_OUTPUT"
              echo "sandbox_name=qwen" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "model_id=nvidia/nemotron-3-super-120b-a12b" >> "$GITHUB_OUTPUT"
              echo "api_key_env=NVIDIA_API_KEY" >> "$GITHUB_OUTPUT"
              echo "sandbox_name=nemotron" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Generate session info
        id: session
        run: |
          SESSION_ID="${{ github.event.inputs.session_id }}"
          if [ -z "$SESSION_ID" ]; then SESSION_ID=$(uuidgen | cut -c1-8); fi
          CHAIN_COUNT="${{ github.event.inputs.chain_count }}"
          if [ -z "$CHAIN_COUNT" ]; then CHAIN_COUNT=0; fi
          NEMOCLAW_CACHE_VERSION="${{ github.event.inputs.nemoclaw_cache_version }}"
          
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            PAYLOAD_COUNT="${{ github.event.client_payload.chain_count }}"
            if [ -n "$PAYLOAD_COUNT" ]; then CHAIN_COUNT="$PAYLOAD_COUNT"; fi
            PAYLOAD_CACHE="${{ github.event.client_payload.nemoclaw_cache_version }}"
            if [ -n "$PAYLOAD_CACHE" ]; then NEMOCLAW_CACHE_VERSION="$PAYLOAD_CACHE"; fi
          fi
          
          if [ -z "$NEMOCLAW_CACHE_VERSION" ]; then NEMOCLAW_CACHE_VERSION="v1"; fi
          
          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_OUTPUT"
          echo "CHAIN_COUNT=$CHAIN_COUNT" >> "$GITHUB_OUTPUT"
          echo "NEMOCLAW_CACHE_VERSION=$NEMOCLAW_CACHE_VERSION" >> "$GITHUB_OUTPUT"
          echo "JOB_START=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "Session: $SESSION_ID | Model: ${{ steps.model.outputs.sandbox_name }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore npm cache
        id: cache-npm-global
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm-global
          key: npm-global-nemoclaw-${{ steps.session.outputs.NEMOCLAW_CACHE_VERSION }}-${{ runner.os }}

      - name: Restore Playwright cache
        id: cache-playwright
        uses: actions/cache/restore@v5
        with:
          path: ~/.playwright-browsers
          key: playwright-browsers-v1-${{ runner.os }}

      - name: Install NemoClaw
        run: |
          export NPM_CONFIG_PREFIX="$HOME/.npm-global"
          export PATH="$HOME/.npm-global/bin:$PATH"
          if [ "${{ steps.cache-npm-global.outputs.cache-hit }}" != "true" ]; then
            npm install -g nemoclaw@latest
          fi

      - name: Install Playwright
        run: |
          export NPM_CONFIG_PREFIX="$HOME/.npm-global"
          export PATH="$HOME/.npm-global/bin:$PATH"
          export PLAYWRIGHT_BROWSERS_PATH="$HOME/.playwright-browsers"
          
          if [ ! -f "$HOME/.npm-global/lib/node_modules/playwright/cli.js" ]; then
            npm install -g playwright
          fi
          
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          fi

      - name: Configure NemoClaw
        env:
          NEMOCLAW_CONFIG: ${{ secrets.NEMOCLAW_CONFIG }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEY_4 }}
        run: |
          NEMOCLAW_DIR="$HOME/.nemoclaw"
          mkdir -p "$NEMOCLAW_DIR"
          
          API_KEY_ENV="${{ steps.model.outputs.api_key_env }}"
          API_KEY="${!API_KEY_ENV}"
          MODEL_ID="${{ steps.model.outputs.model_id }}"
          SANDBOX_NAME="${{ steps.model.outputs.sandbox_name }}"
          
          # Create credentials.json
          cat > "$NEMOCLAW_DIR/credentials.json" << EOF
{
  "version": 1,
  "providers": {
    "nvidia": {
      "endpoint": "https://integrate.api.nvidia.com/v1",
      "model": "$MODEL_ID",
      "apiKey": "$API_KEY"
    }
  }
}
EOF
          
          # Create sandboxes.json
          cat > "$NEMOCLAW_DIR/sandboxes.json" << EOF
{
  "version": 1,
  "default": "$SANDBOX_NAME",
  "sandboxes": {
    "$SANDBOX_NAME": {
      "name": "$SANDBOX_NAME",
      "model": "$MODEL_ID",
      "provider": "nvidia",
      "endpoint": "https://integrate.api.nvidia.com/v1",
      "gatewayPort": 18789,
      "browserPort": 18800,
      "status": "configured"
    }
  }
}
EOF
          
          # Write OpenClaw config
          if [ -n "$NEMOCLAW_CONFIG" ]; then
            CONFIG=$(echo "$NEMOCLAW_CONFIG" | sed "s|C:\\\\Users\\\\[^\\\"]*|$HOME|g" | sed "s|C:/Users/[^/\"]*|$HOME|g" | sed 's|\\\\|/|g')
            echo "$CONFIG" > "$NEMOCLAW_DIR/openclaw.json"
          fi
          
          chmod -R u+rwX "$NEMOCLAW_DIR"

      - name: Start NemoClaw sandbox
        run: |
          export PATH="$HOME/.npm-global/bin:$PATH"
          SANDBOX_NAME="${{ steps.model.outputs.sandbox_name }}"
          
          echo "Starting NemoClaw sandbox: $SANDBOX_NAME"
          nemoclaw "$SANDBOX_NAME" start || nemoclaw onboard
          
          echo "Sandbox started"
          nemoclaw "$SANDBOX_NAME" status

      - name: Setup Tunnel
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://localhost:${{ env.NEMOCLAW_PORT }} &>/tmp/cloudflared.log &
          
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            sleep 2
            TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | head -1)
            if [ -n "$TUNNEL_URL" ]; then
              echo "url=$TUNNEL_URL" >> "$GITHUB_OUTPUT"
              echo "Tunnel established: $TUNNEL_URL"
              break
            fi
          done
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "url=none" >> "$GITHUB_OUTPUT"
            echo "Warning: No tunnel established"
          fi

      - name: Start Gateway
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_POLLING: "true"
        run: |
          export PATH="$HOME/.npm-global/bin:$PATH"
          export PLAYWRIGHT_BROWSERS_PATH="$HOME/.playwright-browsers"
          SANDBOX_NAME="${{ steps.model.outputs.sandbox_name }}"
          
          # Start gateway in background
          nohup nemoclaw gateway --port ${{ env.NEMOCLAW_PORT }} > ~/.nemoclaw/gateway.log 2>&1 &
          
          # Wait for gateway to be ready
          for i in $(seq 1 45); do
            sleep 2
            if curl -sf http://localhost:${{ env.NEMOCLAW_PORT }}/health > /dev/null 2>&1; then
              echo "Gateway is ready!"
              exit 0
            fi
            echo "Waiting for gateway... ($i)"
            if [ -f ~/.nemoclaw/gateway.log ]; then
              tail -5 ~/.nemoclaw/gateway.log 2>/dev/null || true
            fi
          done
          
          echo "Gateway startup timeout"
          cat ~/.nemoclaw/gateway.log 2>/dev/null || true
          exit 1

      - name: Run Session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          export PATH="$HOME/.npm-global/bin:$PATH"
          
          SESSION_ID="${{ steps.session.outputs.SESSION_ID }}"
          CHAIN_COUNT="${{ steps.session.outputs.CHAIN_COUNT }}"
          MODEL="${{ env.SELECTED_MODEL }}"
          CACHE_VERSION="${{ steps.session.outputs.NEMOCLAW_CACHE_VERSION }}"
          
          START_TIME=$(date +%s)
          SESSION_END=$((START_TIME + 21300))    # 5h 55min total session
          CHAIN_TRIGGER=$((START_TIME + ${{ env.CHAIN_TRIGGER_MINUTES }} * 60))
          NEXT_SAVE=$((START_TIME + ${{ env.SAVE_INTERVAL_MINUTES }} * 60))
          
          CHAINED=false
          
          echo "Session: $SESSION_ID | Model: $MODEL | Chain: $CHAIN_COUNT"
          echo "Tunnel: ${{ steps.tunnel.outputs.url }}"
          
          while [ $(date +%s) -lt $SESSION_END ]; do
            NOW=$(date +%s)
            
            # Health check
            if curl -sf http://localhost:${{ env.NEMOCLAW_PORT }}/health > /dev/null 2>&1; then
              echo "[$(date -Iseconds)] Health: OK | Model: $MODEL"
            else
              echo "[$(date -Iseconds)] Health: FAIL - attempting restart"
              nemoclaw gateway --port ${{ env.NEMOCLAW_PORT }} &
              sleep 10
            fi
            
            # Trigger chain before timeout
            if [ "$CHAINED" = "false" ] && [ $NOW -ge $CHAIN_TRIGGER ]; then
              echo "Triggering chain workflow..."
              NEXT_CHAIN=$((CHAIN_COUNT + 1))
              
              curl -X POST \
                -H "Authorization: token $GH_PAT" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/nemoclaw-session-4models.yml/dispatches" \
                -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"session_id\":\"$SESSION_ID\",\"chain_count\":\"$NEXT_CHAIN\",\"nemoclaw_cache_version\":\"$CACHE_VERSION\",\"model\":\"$MODEL\"}}" \
                && echo "Chain triggered successfully" \
                || echo "Chain trigger failed"
              
              CHAINED=true
            fi
            
            sleep 60
          done
          
          echo "Session completed"

      - name: Save npm cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.npm-global
          key: npm-global-nemoclaw-${{ steps.session.outputs.NEMOCLAW_CACHE_VERSION }}-${{ runner.os }}

      - name: Save Playwright cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.playwright-browsers
          key: playwright-browsers-v1-${{ runner.os }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemoclaw-logs-${{ steps.model.outputs.sandbox_name }}-${{ steps.session.outputs.SESSION_ID }}
          path: |
            ~/.nemoclaw/*.log
            /tmp/cloudflared.log
          retention-days: 7
          if-no-files-found: ignore
