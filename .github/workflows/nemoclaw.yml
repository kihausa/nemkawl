name: Nemoclaw Session
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'AI Model'
        required: true
        default: 'kimi'
        type: choice
        options: [nemotron, glm5, kimi, qwen]
      chain:
        description: 'Auto-chain'
        default: true
        type: boolean
      session_id:
        description: 'Session ID'
        type: string
      chain_count:
        description: 'Chain count'
        default: '0'
        type: string

env:
  NODE_VERSION: '22'
  PORT: '4321'

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      model_name: ${{ steps.model.outputs.name }}
      session_id: ${{ steps.meta.outputs.session_id }}
      next_chain: ${{ steps.meta.outputs.next_chain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1 libasound2

      - uses: actions/download-artifact@v4
        with:
          name: nemoclaw-workspace
          path: ~/.nemoclaw/workspace-staging
        continue-on-error: true

      - name: Setup Session
        id: meta
        run: |
          mkdir -p ~/.nemoclaw/workspace ~/.nemoclaw/credentials
          [ -d ~/.nemoclaw/workspace-staging ] && cp -r ~/.nemoclaw/workspace-staging/* ~/.nemoclaw/workspace/ 2>/dev/null && echo "Restored workspace"
          if [ -n "${{ inputs.session_id }}" ]; then
            SID="${{ inputs.session_id }}"
            CC=$(( ${{ inputs.chain_count }} + 1 ))
          else
            SID="nemoclaw-$(date +%s)-$RANDOM"
            CC=1
          fi
          echo "session_id=$SID" >> $GITHUB_OUTPUT
          echo "next_chain=$CC" >> $GITHUB_OUTPUT
          [ -n "${{ secrets.NEMOCLAW_CONFIG }}" ] && echo '${{ secrets.NEMOCLAW_CONFIG }}' > ~/.nemoclaw/openclaw.json

      - uses: actions/cache/restore@v4
        with:
          path: ~/.npm-global
          key: nemoclaw-
        continue-on-error: true

      - name: Set Model
        id: model
        run: |
          case "${{ inputs.model }}" in
            nemotron) M="nvidia-nim-nemotron/nvidia/nemotron-3-super-120b-a12b";;
            glm5) M="nvidia-nim-glm/z-ai/glm5";;
            qwen) M="nvidia-nim-qwen/qwen/qwen3.5-397b-a17b";;
            *) M="nvidia-nim/moonshotai/kimi-k2.5";;
          esac
          echo "name=${{ inputs.model }}" >> $GITHUB_OUTPUT
          echo "full=$M" >> $GITHUB_OUTPUT

      - name: Pick Key
        id: key
        run: |
          K=("${{ secrets.NVIDIA_API_KEY }}" "${{ secrets.NVIDIA_API_KEY_2 }}" "${{ secrets.NVIDIA_API_KEY_3 }}" "${{ secrets.NVIDIA_API_KEY_4 }}" "${{ secrets.NVIDIA_API_KEY_5 }}" "${{ secrets.NVIDIA_API_KEY_6 }}" "${{ secrets.NVIDIA_API_KEY_7 }}" "${{ secrets.NVIDIA_API_KEY_8 }}" "${{ secrets.NVIDIA_API_KEY_9 }}")
          I=$((RANDOM % 9))
          echo "api_key=${K[$I]}" >> $GITHUB_OUTPUT
          echo "key_idx=$I" >> $GITHUB_OUTPUT

      - run: |
          npm config set prefix ~/.npm-global
          npm install -g openclaw localtunnel playwright
          npx playwright install chromium

      - run: |
          echo '{"github":{"token":"${{ secrets.GH_PAT }}"},"nvidia":{"api_key":"${{ steps.key.outputs.api_key }}"}}' > ~/.nemoclaw/credentials.json
          echo '{"runner":{"type":"local","allowed":["web_search","web_fetch","exec","write","read","edit","browser","canvas","cron","message"],"timeout":300}}' > ~/.nemoclaw/sandboxes.json

      - name: Start Tunnel
        id: tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cf
          chmod +x /tmp/cf
          /tmp/cf tunnel --url http://localhost:${{ env.PORT }} &>/tmp/cf.log &
          for i in {1..30}; do
            URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && { echo "url=$URL" >> $GITHUB_OUTPUT; echo "Tunnel: $URL"; break; }
            sleep 2
          done
          if [ -z "$URL" ]; then
            npx localtunnel --port ${{ env.PORT }} &>/tmp/lt.log &
            for i in {1..30}; do
              [ -f /tmp/lt.log ] && URL=$(grep -oP 'https://[^\s]+\.loca\.lt' /tmp/lt.log | head -1)
              [ -n "$URL" ] && { echo "url=$URL" >> $GITHUB_OUTPUT; echo "Fallback: $URL"; break; }
              sleep 2
            done
          fi

      - name: Start Gateway
        run: |
          export PATH="$HOME/.npm-global/bin:$PATH"
          nohup openclaw gateway start --port ${{ env.PORT }} > ~/.nemoclaw/gateway.log 2>&1 &
          sleep 5
          curl -s http://localhost:${{ env.PORT }}/health && echo "Gateway ready" || echo "Check gateway.log"

      - name: Run Session
        run: |
          START=$(date +%s)
          END=$((START + 20520))
          CHAIN_AT=$((START + 19800))
          echo "Session: ${{ steps.meta.outputs.session_id }} | Chain: ${{ steps.meta.outputs.next_chain }}"
          while [ $(date +%s) -lt $END ]; do
            NOW=$(date +%s)
            curl -s http://localhost:${{ env.PORT }}/health > /dev/null 2>&1 && echo "[$(date -Iseconds)] OK | Elapsed: $(( (NOW - START) / 60 ))m" || echo "[$(date -Iseconds)] Check failed"
            if [ $NOW -ge $CHAIN_AT ] && [ ! -f ~/.nemoclaw/.chained ] && [ "${{ inputs.chain }}" = "true" ]; then
              touch ~/.nemoclaw/.chained
              curl -X POST -H "Authorization: token ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/${{ github.repository }}/actions/workflows/nemoclaw.yml/dispatches \
                -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"model\":\"${{ inputs.model }}\",\"chain\":\"true\",\"session_id\":\"${{ steps.meta.outputs.session_id }}\",\"chain_count\":\"${{ steps.meta.outputs.next_chain }}\"}}"
              echo "Chained session launched"
            fi
            sleep 60
          done
          echo "Session complete"

      - if: always() && hashFiles('~/.nemoclaw/openclaw.json')
        run: gh secret set NEMOCLAW_CONFIG -R "${{ github.repository }}" < ~/.nemoclaw/openclaw.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemoclaw-workspace
          path: ~/.nemoclaw/workspace
          retention-days: 90
          overwrite: true

      - if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.npm-global
          key: nemoclaw-${{ github.run_id }}
