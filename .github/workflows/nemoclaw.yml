name: Nemoclaw Session
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'AI Model'
        required: true
        default: 'kimi'
        type: choice
        options: [nemotron, glm5, kimi, qwen]
      chain:
        description: 'Auto-chain'
        required: false
        default: true
        type: boolean
      session_id:
        description: 'Session ID'
        required: false
        type: string
      chain_count:
        description: 'Chain #'
        required: false
        default: '0'
        type: string

env:
  NODE_VERSION: '22'
  PORT: '18789'

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libatk-bridge2.0 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1 libasound2t64 || sudo apt-get install -y -qq libasound2

      - uses: actions/download-artifact@v4
        with:
          name: nemoclaw-workspace
          path: ~/.openclaw-staging
        continue-on-error: true

      - name: Setup
        id: meta
        env:
          CONFIG_DATA: ${{ secrets.NEMOCLAW_CONFIG }}
        run: |
          mkdir -p ~/.openclaw ~/.nemoclaw/workspace
          [ -d ~/.openclaw-staging ] && cp -r ~/.openclaw-staging/* ~/.openclaw/ 2>/dev/null && echo "Restored" || true
          if [ -n "${{ inputs.session_id }}" ]; then
            echo "session_id=${{ inputs.session_id }}" >> $GITHUB_OUTPUT
            echo "next_chain=$(( ${{ inputs.chain_count }} + 1 ))" >> $GITHUB_OUTPUT
          else
            echo "session_id=nemoclaw-$(date +%s)" >> $GITHUB_OUTPUT
            echo "next_chain=1" >> $GITHUB_OUTPUT
          fi
          [ -n "$CONFIG_DATA" ] && echo "$CONFIG_DATA" > ~/.openclaw/config.json

      - name: Model
        id: model
        run: |
          case "${{ inputs.model }}" in
            nemotron) M="nvidia-nim-nemotron/nvidia/nemotron-3-super-120b-a12b" ;;
            glm5) M="nvidia-nim-glm/z-ai/glm5" ;;
            qwen) M="nvidia-nim-qwen/qwen/qwen3.5-397b-a17b" ;;
            *) M="nvidia-nim/moonshotai/kimi-k2.5" ;;
          esac
          echo "name=${{ inputs.model }}" >> $GITHUB_OUTPUT
          echo "full=$M" >> $GITHUB_OUTPUT

      - run: |
          npm config set prefix ~/.npm-global
          npm install -g openclaw localtunnel playwright
          npx playwright install chromium

      - name: Configs
        run: |
          mkdir -p ~/.openclaw ~/.nemoclaw
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          echo "{\"telegram\":{\"enabled\":true,\"botToken\":\"$BOT_TOKEN\",\"polling\":true}}" > ~/.openclaw/channels.json
          echo "{\"github\":{\"token\":\"${{ secrets.GH_PAT }}\"}}" > ~/.openclaw/credentials.json
          echo "{\"github\":{\"token\":\"${{ secrets.GH_PAT }}\"},\"telegram\":{\"bot_token\":\"$BOT_TOKEN\",\"chat_id\":\"$CHAT_ID\"}}" > ~/.nemoclaw/credentials.json
          echo "{\"runner\":{\"type\":\"local\",\"allowed\":[\"web_search\",\"web_fetch\",\"exec\",\"write\",\"read\",\"edit\",\"browser\",\"canvas\",\"cron\",\"message\"],\"timeout\":300}}" > ~/.nemoclaw/sandboxes.json

      - name: Pairing Watcher
        run: |
          cat > /tmp/pairing.sh << 'END'
          export PATH="$HOME/.npm-global/bin:$PATH"
          sleep 5
          for i in $(seq 1 60); do
            [ -f ~/.openclaw/gateway.log ] || continue
            CODE=$(grep -oP 'Pairing code: \K[A-Z0-9]+' ~/.openclaw/gateway.log 2>/dev/null | tail -1)
            [ -n "$CODE" ] && openclaw pairing approve telegram "$CODE" 2>/dev/null && break
            sleep 2
          done
          END
          chmod +x /tmp/pairing.sh
          nohup /tmp/pairing.sh > /tmp/pairing.log 2>&1 &

      - name: Tunnel
        id: tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cf
          chmod +x /tmp/cf
          /tmp/cf tunnel --url http://localhost:18789 &>/tmp/cf.log &
          for i in $(seq 1 30); do
            sleep 2
            URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log 2>/dev/null | head -1)
            [ -n "$URL" ] && { echo "url=$URL" >> $GITHUB_OUTPUT; echo "Tunnel: $URL"; break; }
          done
          [ -z "$URL" ] && echo "url=none" >> $GITHUB_OUTPUT

      - name: Gateway
        run: |
          export PATH="$HOME/.npm-global/bin:$PATH"
          mkdir -p ~/.openclaw
          nohup openclaw gateway --allow-unconfigured > ~/.openclaw/gateway.log 2>&1 &
          for i in $(seq 1 45); do
            sleep 2
            curl -sf http://localhost:18789/health > /dev/null 2>&1 && { echo "Ready!"; grep -i telegram ~/.openclaw/gateway.log 2>/dev/null | tail -3; exit 0; }
            PAIRING=$(grep "Pairing code:" ~/.openclaw/gateway.log 2>/dev/null | tail -1)
            [ -n "$PAIRING" ] && echo "Waiting: $PAIRING"
            echo "($i)"
          done
          tail -100 ~/.openclaw/gateway.log
          cat /tmp/pairing.log 2>/dev/null
          exit 1

      - name: Loop
        run: |
          START=$(date +%s)
          END=$((START + 21300))
          CHAIN_AT=$((START + 21000))
          while [ $(date +%s) -lt $END ]; do
            NOW=$(date +%s)
            curl -sf http://localhost:18789/health > /dev/null && echo "[$(date -Iseconds)] OK" || echo "[$(date -Iseconds)] FAIL"
            if [ $NOW -ge $CHAIN_AT ] && [ ! -f ~/.nemoclaw/.chained ] && [ "${{ inputs.chain }}" = "true" ]; then
              touch ~/.nemoclaw/.chained
              curl -X POST -H "Authorization: token ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/nemoclaw.yml/dispatches" \
                -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"model\":\"${{ inputs.model }}\",\"chain\":\"true\",\"session_id\":\"${{ steps.meta.outputs.session_id }}\",\"chain_count\":\"${{ steps.meta.outputs.next_chain }}\"}}"
              echo "Chained"
            fi
            sleep 60
          done
          echo "Done"

      - if: always()
        run: |
          [ -f ~/.openclaw/config.json ] && gh secret set NEMOCLAW_CONFIG -R "${{ github.repository }}" < ~/.openclaw/config.json 2>/dev/null || true
          [ -f ~/.nemoclaw/openclaw.json ] && gh secret set NEMOCLAW_CONFIG -R "${{ github.repository }}" < ~/.nemoclaw/openclaw.json 2>/dev/null || true
        continue-on-error: true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nemoclaw-workspace
          path: ~/.openclaw/
          retention-days: 90
          overwrite: true
